<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tangrams</title>

    <link rel="stylesheet" type="text/css" href="style.css">

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
  </head>

  <body>
    <div id="controls" style="position:fixed;top:8px;left:8px;z-index:999;background:rgba(255,255,255,0.95);padding:8px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,0.12);max-width:320px;">
      <h1>Tangrams</h1>
      <label for="levelSelect">Level:</label>
      <select id="levelSelect"></select>
      <button id="checkBtn">Check Solution</button>
      <button id="showAnswerBtn">Give Up / Show Answer</button>
      <button id="resetBtn">Reset</button>
      <div id="directions" style="margin-top:8px;font-size:11px;color:#222;line-height:1.25;">
        Arrange pieces in the gray target(s). Touch to drag, double tap to rotate/flip or <strong>f</strong>
        to flip and <strong>r</strong> to rotate. When pieces fully
        cover the target, click <strong>Check Solution</strong> or <strong>Give Up / Show Answer</strong>.
      </div>
    </div>
    <script src="sketch.js"></script>
  </body>
</html>
